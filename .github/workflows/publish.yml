# Publication npm @mnemoclaw/immune-mcp — requiert le secret NPM_TOKEN (scope @mnemoclaw).
name: publish
on:
  workflow_dispatch:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # provenance npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24   # npm ≥ 11.5 : requis pour Trusted Publishing (OIDC, sans NPM_TOKEN)
          registry-url: 'https://registry.npmjs.org'
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
